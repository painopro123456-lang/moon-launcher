name: Build Moon Launcher for Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check launcher JavaScript syntax
        run: node --check src/main.cjs
      - name: Build Windows installer and portable EXE
        run: npm run dist:win
      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Launcher-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 14
