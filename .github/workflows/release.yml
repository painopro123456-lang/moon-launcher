name: Release Moon Launcher

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate release version and updater configuration
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $package.version) { throw "package.json is missing a version." }
          if ("v$($package.version)" -ne "$env:GITHUB_REF_NAME") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version v$($package.version)."
          }
          if (-not $package.build.publish -or $package.build.publish[0].provider -ne "github") {
            throw "electron-builder GitHub publish configuration is missing."
          }
          Write-Host "Publishing Moon Launcher version $($package.version)"
      - name: Build Windows installer and portable EXE
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: npm run dist:win
      - name: Upload Windows EXE artifacts
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Launcher-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Build and publish Windows installer and updater metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
