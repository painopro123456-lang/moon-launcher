name: Build downloadable Moon Launcher EXE and installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moon-launcher-windows-build
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build native Moon Launcher for Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore and publish native Windows application
        shell: pwsh
        run: |
          dotnet restore native/MoonLauncher.csproj
          dotnet publish native/MoonLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist
          $exe = "dist/Moon-Launcher.exe"
          if (-not (Test-Path $exe)) { throw "Native Moon Launcher EXE was not created." }
          if ((Get-Item $exe).Length -lt 1000000) { throw "Moon Launcher EXE is unexpectedly small." }
          Copy-Item $exe "dist/Moon-Launcher-Portable.exe" -Force

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Launcher-Windows-x64
          path: |
            dist/Moon-Launcher.exe
            dist/Moon-Launcher-Portable.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish native EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          name: Moon Launcher — Latest Windows Build
          body: |
            **Moon Launcher for Windows x64**
            - Native self-contained Windows EXE.
            - Microsoft Client ID is embedded for Microsoft sign-in.
            - Minecraft installation and launch use the native .NET launcher engine.
          files: |
            dist/Moon-Launcher.exe
            dist/Moon-Launcher-Portable.exe
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
