name: Build downloadable Moon Launcher EXE and installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moon-launcher-windows-build
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build original Electron Moon Launcher UI for Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Windows app icon
        shell: pwsh
        run: |
          npm install --no-save sharp png-to-ico
          node scripts/build-icon.cjs
          if (-not (Test-Path "native/moon-icon.ico")) { throw "App icon was not generated." }

      - name: Build Electron portable EXE and installer
        run: npm run dist:win

      - name: Verify outputs
        shell: pwsh
        run: |
          $exe = Get-Item "dist/Moon-Launcher.exe" -ErrorAction SilentlyContinue
          $setup = Get-Item "dist/Moon-Launcher-Setup.exe" -ErrorAction SilentlyContinue
          if (-not $exe -or $exe.Length -lt 10000000) { throw "Portable Electron EXE missing or unexpectedly small." }
          if (-not $setup -or $setup.Length -lt 10000000) { throw "Installer missing or unexpectedly small." }

      - name: Upload EXE and installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Launcher-Windows-x64
          path: |
            dist/Moon-Launcher.exe
            dist/Moon-Launcher-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloads to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          name: Moon Launcher — Latest Windows Build
          body: |
            **Moon Launcher for Windows x64**

            This build uses the original Electron-based Moon Launcher interface.
            - **Moon-Launcher-Setup.exe** — installer.
            - **Moon-Launcher.exe** — portable version.
          files: |
            dist/Moon-Launcher.exe
            dist/Moon-Launcher-Setup.exe
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
