name: Windows native download

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Electron-free native Windows app
    runs-on: windows-latest
    steps:
      - name: Check out Moon Launcher
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build self-contained native app
        run: dotnet publish native/MoonLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist

      - name: Verify executable exists
        shell: pwsh
        run: |
          $app = Get-Item "dist/Moon-Launcher.exe" -ErrorAction SilentlyContinue
          if (-not $app) { throw "Native Moon Launcher executable was not produced at dist/Moon-Launcher.exe." }
          Write-Host "Built $($app.FullName) ($($app.Length) bytes)"

      - name: Upload direct Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Launcher-Native-Windows
          path: dist/Moon-Launcher.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct executable download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          name: Moon Launcher — Native Windows Build
          body: |
            Electron-free native WPF migration build for Windows x64.

            Download **Moon-Launcher.exe** and run it. This is a self-contained app executable, not an installer.
            This initial migration build includes the native UI, local instance records, and official Minecraft version catalog. Game installation, launching, Microsoft login, modpacks, and the previous settings are not yet ported.
          files: dist/Moon-Launcher.exe
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show direct EXE download on workflow page
        if: success()
        shell: pwsh
        run: |
          @"
          ## Moon Launcher — native Windows build

          [Download Moon-Launcher.exe](https://github.com/painopro123456-lang/moon-launcher/releases/download/latest/Moon-Launcher.exe)

          This is a self-contained native WPF executable; it is not an installer.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
