name: Build downloadable Moon Launcher EXE and installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moon-launcher-windows-build
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build native Moon Launcher for Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build self-contained single-file WPF EXE
        shell: pwsh
        run: |
          dotnet publish native/MoonLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist
          $exe = Get-Item "dist/Moon-Launcher.exe" -ErrorAction SilentlyContinue
          if (-not $exe -or $exe.Length -lt 1000000) { throw "Native Moon-Launcher.exe missing or unexpectedly small." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "installer/MoonLauncher.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = Get-Item "dist/Moon-Launcher-Setup.exe" -ErrorAction SilentlyContinue
          if (-not $setup -or $setup.Length -lt 1000000) { throw "Moon-Launcher-Setup.exe missing or unexpectedly small." }

      - name: Upload EXE and installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Launcher-Windows-x64
          path: |
            dist/Moon-Launcher.exe
            dist/Moon-Launcher-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloads to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          name: Moon Launcher — Latest Windows Build
          body: |
            **Moon Launcher for Windows x64**
            - **Moon-Launcher.exe** — portable native WPF app.
            - **Moon-Launcher-Setup.exe** — Windows installer.
          files: |
            dist/Moon-Launcher.exe
            dist/Moon-Launcher-Setup.exe
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
