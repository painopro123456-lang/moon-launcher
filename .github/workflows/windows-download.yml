name: Build downloadable Moon Launcher EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moon-launcher-windows-build
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build portable Windows x64 EXE
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore project
        run: dotnet restore native/MoonLauncher.csproj

      - name: Build single-file portable EXE
        run: >-
          dotnet publish native/MoonLauncher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output publish

      - name: Verify downloadable EXE
        shell: pwsh
        run: |
          $exe = Get-Item "publish/Moon-Launcher.exe" -ErrorAction SilentlyContinue
          if (-not $exe) {
            Get-ChildItem "publish" -Recurse | Format-Table FullName, Length
            throw "Build failed: publish/Moon-Launcher.exe was not created."
          }
          if ($exe.Length -lt 1000000) {
            throw "The EXE is unexpectedly small ($($exe.Length) bytes); refusing to publish a likely incomplete build."
          }
          Write-Host "Verified $($exe.FullName)"
          Write-Host "Size: $($exe.Length) bytes"

      - name: Upload EXE as a downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Launcher-Windows-x64
          path: publish/Moon-Launcher.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct EXE download to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          name: Moon Launcher — Latest Windows Build
          body: |
            **Portable Windows x64 build of Moon Launcher.**

            Download **Moon-Launcher.exe** below and run it directly. This build is self-contained and does not require a separate .NET installation.

            If Windows SmartScreen shows a warning, only run the file if you trust this source and downloaded it from this repository.
          files: publish/Moon-Launcher.exe
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print download links
        if: success()
        shell: pwsh
        run: |
          @"
          ## Moon Launcher is ready

          - [Download Moon-Launcher.exe](https://github.com/painopro123456-lang/moon-launcher/releases/download/latest/Moon-Launcher.exe)
          - [Open all workflow runs and artifacts](https://github.com/painopro123456-lang/moon-launcher/actions/workflows/build-portable-exe.yml)
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
