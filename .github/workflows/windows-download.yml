name: Windows download

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build direct Windows setup download
    runs-on: windows-latest
    steps:
      - name: Check out Moon Launcher
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Check JavaScript syntax
        run: |
          node --check src/main.cjs
          node --check src/preload.cjs
          node --check src/renderer.js

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run dist:win

      - name: Give setup a stable download filename
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist" -Filter "Moon-Launcher-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows setup .exe was not produced." }
          Copy-Item $installer.FullName "dist/Moon-Launcher-Setup.exe" -Force


      - name: Upload Windows installer to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Launcher-Windows-Setup
          path: dist/Moon-Launcher-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct setup download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          name: Moon Launcher — Latest Windows Setup
          body: |
            Direct Windows installer for the latest Moon Launcher build.

            Download **Moon-Launcher-Setup.exe** and run it. No ZIP extraction is needed.
          files: dist/Moon-Launcher-Setup.exe
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
