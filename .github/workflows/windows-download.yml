name: Build downloadable Moon Launcher EXE and installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moon-launcher-windows-build
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows x64 EXE and installer
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Node.js for icon generation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate app icon from project artwork
        shell: pwsh
        run: |
          npm install --no-save sharp png-to-ico
          node scripts/build-icon.cjs
          if (-not (Test-Path "native/moon-icon.ico")) { throw "App icon was not generated." }

      - name: Restore project
        run: dotnet restore native/MoonLauncher.csproj

      - name: Build portable EXE with embedded icon
        run: >-
          dotnet publish native/MoonLauncher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output dist

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-Item "dist/Moon-Launcher.exe" -ErrorAction SilentlyContinue
          if (-not $exe -or $exe.Length -lt 1000000) { throw "Moon-Launcher.exe missing or unexpectedly small." }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer/MoonLauncher.iss"
          $setup = Get-Item "dist/Moon-Launcher-Setup.exe" -ErrorAction SilentlyContinue
          if (-not $setup -or $setup.Length -lt 1000000) { throw "Moon-Launcher-Setup.exe was not created." }

      - name: Upload EXE and installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Launcher-Windows-x64
          path: |
            dist/Moon-Launcher.exe
            dist/Moon-Launcher-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloads to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          name: Moon Launcher — Latest Windows Build
          body: |
            **Moon Launcher for Windows x64**

            - **Moon-Launcher-Setup.exe** — installer. Creates Start Menu shortcuts and optionally a desktop shortcut.
            - **Moon-Launcher.exe** — portable version.

            The app icon is embedded in the executable and used by the installer.
          files: |
            dist/Moon-Launcher.exe
            dist/Moon-Launcher-Setup.exe
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
